name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.8
      - run: ruff check .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install only the lightweight deps the unit tests actually exercise.
      # The heavy ML stack (torch/transformers/sentence-transformers) is
      # lazily imported by lpbf_defect_reasoning.generation/indexing and is
      # only needed to *run* the pipeline against real models - the release
      # workflow's Docker build is what exercises that full install. Keeping
      # CI on the light path keeps runs fast and avoids multi-GB downloads
      # on every push.
      - name: Install package (no heavy ML deps) + dev tools
        run: |
          pip install --no-deps -e .
          pip install numpy pandas networkx "faiss-cpu>=1.7.4,<2" -r requirements-dev.txt

      - name: Run tests
        run: pytest -q --cov=lpbf_defect_reasoning --cov-report=term-missing

      - name: Validate demo notebook is well-formed JSON
        run: python -c "import json; json.load(open('notebooks/AI_Defect_Reasoning_LPBF.ipynb'))"
